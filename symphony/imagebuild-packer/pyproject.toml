[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "simbricks-imagebuild-packer"
version = "0.5.2"
description = "SimBricks disk image builds in a booted guest with packer, and extraction of the boot artifacts simulators need"
authors  = [
  "Team SimBricks <team@simbricks.io>"
]
homepage = "https://www.simbricks.io/"
packages = [
  { include = "simbricks" }
]
include = [
  { path = "simbricks/imagebuild/packer/data/**/*", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = ">=3.10"
typing-extensions = ">=4.14.1"
simbricks-orchestration = ">=0.5.2"
simbricks-utils = ">=0.5.0"
